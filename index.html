<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1412" media="(prefers-color-scheme: dark)" />
    <!-- Home-screen app: full screen, drawn under the status bar (pages pad with .pt-safe). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="StudentLoop" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="StudentLoop is a campus delivery network. Order from campus shops, post errands, or earn by delivering for other students."
    />
    <meta property="og:title" content="StudentLoop: campus delivery by students, for students" />
    <meta
      property="og:description"
      content="Order from campus shops, post errands, or earn by delivering for other students."
    />
    <meta property="og:type" content="website" />
    <title>StudentLoop: campus delivery by students</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint to avoid a flash (same rule as src/lib/theme.ts).
      try {
        var choice = localStorage.getItem('sl_theme_choice');
        if (choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <script>
      // Chrome offers to install the app once per page load, usually before the
      // Profile page (which has the Install button) has loaded. Keep the offer for it.
      addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
